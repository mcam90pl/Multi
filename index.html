<style>
:root{color-scheme:dark;--bg:#071016;--panel:#101c24;--panel2:#14242e;--line:#29404b;--text:#e9eff1;--muted:#91a5ae;--amber:#eed28a;--orange:#ef7a3c;--red:#ff766e;--green:#6cddbc}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 82% 0,#213b4c 0,transparent 50%),radial-gradient(circle at 12% 88%,#162e37 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,textarea,input{font:inherit}button{border:1px solid var(--line);background:#1b2b35;color:var(--text);padding:12px 17px;border-radius:7px;cursor:pointer}button:hover{border-color:var(--amber)}button:disabled{opacity:.38;cursor:not-allowed}.primary{background:var(--amber);border-color:var(--amber);color:#172019;font-weight:800}.danger{border-color:#8e4545}.shell{width:min(1220px,94vw);margin:0 auto;padding:28px 0 45px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.grow{flex:1}.eyebrow,small{color:var(--amber);font:11px ui-monospace,SFMono-Regular,monospace;letter-spacing:2px;text-transform:uppercase}.top h1{font-size:clamp(30px,5vw,56px);line-height:1;margin:4px 0}.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:22px;box-shadow:0 16px 40px #0004}.hero{max-width:920px;margin:4vh auto}.hero h2{font-size:clamp(26px,4vw,42px);margin:8px 0}.hero p{color:var(--muted)}.rolegrid,.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.role{min-height:120px;text-align:left;padding:21px}.role b{display:block;font-size:23px;margin-bottom:7px}.role span{color:var(--muted);font-size:13px}.note,.status{border-left:3px solid var(--orange);background:#1b1713;padding:11px 14px;color:#e8d8ae}.steps textarea{width:100%;min-height:122px;resize:vertical;background:#071119;color:#dbe6ea;border:1px solid var(--line);border-radius:7px;padding:11px;font:11px/1.35 ui-monospace,monospace}.steps h3{margin:7px 0 12px}.steps button{margin-top:9px}.ships{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}.ship{position:relative;overflow:hidden}.ship.target{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 26px #ff443333}.ship.out{opacity:.55}.ship h3{font-size:20px;margin:4px 0}.art{height:145px;display:grid;place-items:center;color:var(--amber);filter:drop-shadow(0 15px 18px #000)}.art.enemy{color:var(--orange)}.art svg{width:240px;max-width:92%;height:135px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{background:#071218bb;border-radius:6px;padding:7px}.stat span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.stat b{font:17px ui-monospace,monospace}.bar{height:5px;background:#23343d;margin-top:4px}.bar i{display:block;height:100%;background:var(--green)}.ship p{color:var(--muted);margin-bottom:0}.controls,.rolls,.journal{margin-top:16px}.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.orders button{padding:16px}.orders button.on{border-color:var(--amber);background:#303a2d}.checks{display:flex;gap:18px;flex-wrap:wrap;margin:13px 0}.checks label{display:flex;align-items:center;gap:7px;color:var(--muted)}.checks input{accent-color:var(--amber)}.wait{text-align:center;padding:18px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}.badge{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:6px 10px;color:var(--amber);font-size:12px}.rollrow{padding:9px 0;border-bottom:1px solid #243740}.dice{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.die{width:31px;height:31px;display:grid;place-items:center;background:#59292d;border:1px solid #b65358;transform:rotate(45deg);border-radius:4px}.die.green{background:#17594d;border-color:#5ccdb0}.die span{transform:rotate(-45deg);font-weight:900}.log{max-height:280px;overflow:auto;font:12px/1.7 ui-monospace,monospace}.log div{padding:6px 0;border-bottom:1px solid #22343d}.result{text-align:center;padding:28px}.result h2{font-size:40px;margin:8px}.hidden{display:none!important}
.linkconfig{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:9px;background:#09141b}.linkconfig label{display:block;color:var(--amber);font-weight:700;margin-bottom:8px}.linkconfig input,.linkconfig textarea{width:100%;background:#071119;color:#dbe6ea;border:1px solid var(--line);border-radius:7px;padding:11px}.linkconfig textarea{min-height:120px;resize:vertical}.linkconfig .row{display:flex;gap:9px;flex-wrap:wrap}.linkconfig .row textarea{flex:1 1 100%}.linkconfig p{margin:8px 0 0;font-size:12px}.ready{color:var(--green)!important}.diagnostics{margin-top:13px;border:1px solid #8e4545;border-radius:8px;background:#120d0f;padding:12px}.diagnostics summary{cursor:pointer;color:var(--red);font-weight:800}.diagnostics pre{white-space:pre-wrap;word-break:break-word;background:#06090b;padding:10px;border-radius:6px;color:#c9d5da;font:11px/1.45 ui-monospace,monospace;max-height:260px;overflow:auto}.diagnostics button{padding:8px 12px}
@media(max-width:900px){.ships{grid-template-columns:1fr 1fr}.ships .enemycard{grid-column:1/-1}.twocol{grid-template-columns:1fr}}

/* Kontakt z Kalaxianami, tryb obserwatora i epilog. */
.contact{max-width:980px;margin:2vh auto}.signal{position:relative;height:300px;margin:18px 0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 46%,#33454b 0,#111a20 28%,#05090c 70%);border:1px solid #394a52;border-radius:10px}.signal:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#b8d7df0b 4px 5px);animation:scan 4s linear infinite}.signal:after{content:"SYGNAŁ WIDEO · ŹRÓDŁO NIEZNANE";position:absolute;left:15px;bottom:12px;color:#a9bac1;font:10px ui-monospace,monospace;letter-spacing:2px}.shadow139{width:180px;height:235px;border-radius:48% 44% 34% 38%;background:radial-gradient(ellipse at 55% 32%,#222b30 0,#090d10 45%,#000 72%);filter:blur(7px);opacity:.82;animation:distort 1.8s steps(2) infinite;box-shadow:0 0 45px #6b879122}.static139{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 47%,#d9f4ff12 49%,transparent 52%);animation:noise 1.2s steps(2) infinite}.dialogue{display:grid;gap:8px;margin:16px 0}.line{padding:10px 13px;border-left:3px solid var(--line);background:#09131a}.line b{color:var(--amber);margin-right:8px}.line.system{border-color:var(--red);color:#d6a9a6;font-family:ui-monospace,monospace}.observer{padding:18px;border:1px dashed var(--amber);border-radius:9px;background:#151a17}.epilogue{text-align:left;max-width:700px;margin:18px auto}.epilogue .line{margin:7px 0}@keyframes scan{to{transform:translateY(6px)}}@keyframes distort{0%,100%{transform:translate(-4px,1px) scale(1)}50%{transform:translate(5px,-2px) scale(1.03,.98)}}@keyframes noise{0%,100%{transform:translateX(-35%)}50%{transform:translateX(45%)}}
/* Efekty walki i osobne nastroje ekranów. */
body.lobbymode{background:radial-gradient(ellipse at 80% 0,#234253 0,transparent 55%),#071016}body.contactmode{background:radial-gradient(circle at 50% 25%,#27363c 0,#090e12 50%,#020405 100%)}body.battlemode{background:radial-gradient(ellipse at 70% 10%,#203d49 0,transparent 50%),radial-gradient(circle at 10% 90%,#30191a 0,transparent 38%),#060d12}body.epiloguemode{background:radial-gradient(circle at 50% 20%,#263840 0,transparent 48%),#050a0d}.ship.hitflash{animation:hitFlash .7s ease-out}.ship.firing .art:before{content:"";position:absolute;left:48%;top:48%;width:150%;height:3px;background:linear-gradient(90deg,#fff7c9,var(--orange),transparent);box-shadow:0 0 13px var(--orange);transform-origin:left;animation:laser .65s ease-out;z-index:4}.ship .art{position:relative}.ship .sparks{position:absolute;inset:15% 18%;pointer-events:none}.ship.damaged .sparks:before,.ship.critical .sparks:before{content:"";position:absolute;right:12%;top:38%;width:7px;height:7px;border-radius:50%;background:#fff4b8;box-shadow:13px -10px 0 #ef7a3c,-9px 13px 0 #ff766e,18px 15px 0 #eed28a;animation:sparks 1.1s steps(2) infinite}.ship.damaged .art svg{filter:sepia(.25) drop-shadow(0 0 8px #ef7a3c55)}.ship.critical{border-color:#8d3e3e}.ship.critical .art svg{filter:sepia(.7) saturate(1.5) drop-shadow(0 0 13px #ff443388);animation:criticalPulse 1.2s ease-in-out infinite}.art.enemy:after{content:"";position:absolute;inset:7% 4%;background:repeating-linear-gradient(0deg,transparent 0 5px,#d9f4ff12 6px 7px);mix-blend-mode:screen;animation:enemyInterference 1.4s steps(2) infinite}.summarygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.summarybox{background:#081219;border:1px solid var(--line);border-radius:8px;padding:11px}.summarybox span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.summarybox b{font:20px ui-monospace,monospace}.versionok{color:var(--green)}.versionbad{color:var(--red)}@keyframes hitFlash{0%{box-shadow:0 0 0 2px #fff,0 0 45px #ff4433}100%{box-shadow:none}}@keyframes laser{0%{opacity:0;transform:scaleX(.05)}25%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}@keyframes sparks{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}@keyframes criticalPulse{50%{opacity:.72;transform:translateY(2px)}}@keyframes enemyInterference{0%,100%{transform:translateY(-4px);opacity:.4}50%{transform:translateY(7px);opacity:.8}}@media(max-width:640px){.summarygrid{grid-template-columns:1fr 1fr}.signal{height:240px}}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
const APP_VERSION='1.3.3';
const TURN_STORAGE_KEY='monit_turn_api_url';
const ORDERS={atak:'Atak',obrona:'Obrona',ucieczka:'Ucieczka'};
const FITS={
 dex:{key:'dex',name:'Iskra-7 „Dexter”',attack:5,agility:2,initiative:3,maxShield:1,shield:1,maxHull:5,hull:5,maxEnergy:2,energy:2,torpedoes:1,escaped:false,loadout:'Załogant ofensywny · droid inicjatywy · Zbiry · torpeda'},
 parker:{key:'parker',name:'Peregryn Parkera',attack:7,agility:3,initiative:2,maxShield:3,shield:3,maxHull:7,hull:7,maxEnergy:2,energy:2,torpedoes:1,escaped:false,loadout:'Konfiguracja z ostatniego starcia z Princem · torpeda'},
 enemy:{key:'enemy',name:'Okręt Kalaxian',attack:6,agility:6,initiative:6,maxShield:6,shield:6,maxHull:20,hull:20,maxEnergy:6,energy:6,torpedoes:0,escaped:false,loadout:'Wyposażenie: nieznane'}
};
let MP={role:null,host:false,pc:null,dc:null,state:null,localOrder:null,draft:null,status:'',signal:'',peerVersion:null,heartbeat:null,lastPong:0,recoverTimer:null,connectTimer:null,diagnostics:[]};
const $=q=>document.querySelector(q),clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setApp(html){document.getElementById('app').innerHTML=html;}
function setMode(mode){document.body.className=mode}
function resetConnection(){if(MP.heartbeat)clearInterval(MP.heartbeat);if(MP.recoverTimer)clearTimeout(MP.recoverTimer);if(MP.connectTimer)clearTimeout(MP.connectTimer);try{MP.dc?.close()}catch{}try{MP.pc?.close()}catch{}MP={role:null,host:false,pc:null,dc:null,state:null,localOrder:null,draft:null,status:'',signal:'',peerVersion:null,heartbeat:null,lastPong:0,recoverTimer:null,connectTimer:null,diagnostics:[]};}
function safeDiag(value){return String(value??'').replace(/([?&]apiKey=)[^&\s"']+/gi,'$1[UKRYTY]').replace(/("?(?:credential|password)"?\s*[:=]\s*)[^,}\s]+/gi,'$1[UKRYTY]')}
function addDiag(event,data={}){MP.diagnostics=MP.diagnostics||[];MP.diagnostics.push({time:new Date().toISOString(),event,...Object.fromEntries(Object.entries(data).map(([k,v])=>[k,safeDiag(v)]))});if(MP.diagnostics.length>40)MP.diagnostics.shift()}
function candidateStats(){const sdp=MP.pc?.localDescription?.sdp||'',types=[...sdp.matchAll(/ typ (host|srflx|prflx|relay) /g)].map(m=>m[1]);return{host:types.filter(x=>x==='host').length,srflx:types.filter(x=>x==='srflx').length,prflx:types.filter(x=>x==='prflx').length,relay:types.filter(x=>x==='relay').length}}
function diagnosticReport(){const pc=MP.pc;return JSON.stringify({appVersion:APP_VERSION,role:MP.role||'brak',status:MP.status||'brak',connectionState:pc?.connectionState||'brak',iceConnectionState:pc?.iceConnectionState||'brak',iceGatheringState:pc?.iceGatheringState||'brak',signalingState:pc?.signalingState||'brak',dataChannelState:MP.dc?.readyState||'brak',candidates:candidateStats(),events:MP.diagnostics||[]},null,2)}
function diagnosticHtml(){if(!MP.diagnostics?.length&&!/Błąd|nieudane|nie została|Przekroczono/i.test(MP.status||''))return'';return `<details class="diagnostics" open><summary>Raport techniczny połączenia</summary><pre>${esc(diagnosticReport())}</pre><button onclick="copyDiagnostics()">Kopiuj raport</button></details>`}
function copyDiagnostics(){navigator.clipboard?.writeText(diagnosticReport()).then(()=>{const b=document.querySelector('.diagnostics button');if(b)b.textContent='Skopiowano'}).catch(()=>{})}
function updateConnectionView(){const e=document.getElementById('status')||document.querySelector('.status');if(e)e.textContent=MP.status||'Łączenie…';const d=document.getElementById('diagnostics');if(d)d.innerHTML=diagnosticHtml()}
function turnConfig(){try{return localStorage.getItem(TURN_STORAGE_KEY)||''}catch{return''}}
function parseTurnConfig(value){const text=String(value||'').trim(),api=text.match(/https:\/\/[^"'\s]+\.metered\.live\/api\/v1\/turn\/credentials\?apiKey=[A-Za-z0-9._-]+/i);if(api)return api[0];const blocks=text.match(/\{[\s\S]*?\}/g)||[],list=[];for(const block of blocks){const pick=name=>{const m=block.match(new RegExp(name+'\\s*:\\s*(["\\\'])([\\s\\S]*?)\\1'));return m?.[2]||''},urls=pick('urls');if(!urls)continue;const item={urls},username=pick('username'),credential=pick('credential');if(username)item.username=username;if(credential)item.credential=credential;list.push(item)}if(!list.some(x=>String(x.urls).startsWith('turn')))throw Error('Nie znaleziono konfiguracji. Wklej pełny adres API albo cały blok „const iceServers = […]”.');if(list.some(x=>String(x.urls).startsWith('turn')&&(!x.username||!x.credential)))throw Error('W konfiguracji TURN brakuje username lub credential.');return list}
function saveTurn(){try{const parsed=parseTurnConfig($('#turnApi')?.value);localStorage.setItem(TURN_STORAGE_KEY,typeof parsed==='string'?parsed:JSON.stringify(parsed));lobby()}catch(e){alert(e.message)}}
function clearTurn(){try{localStorage.removeItem(TURN_STORAGE_KEY)}catch{}lobby()}
function lobby(){resetConnection();setMode('lobbymode');const configured=!!turnConfig();setApp(`<main class="shell"><div class="top"><div><small>M.O.N.I.T. · ŁĄCZE TAKTYCZNE TURN</small><h1>Walka Multiplayer</h1></div><span class="grow"></span><span class="badge">WERSJA ${APP_VERSION}</span></div><section class="panel hero"><small>DEXTER I PARKER KONTRA KALAXIAN</small><h2>Wybierz stanowisko</h2><p>Dexter tworzy połączenie, a Parker dołącza na drugim komputerze. Kody połączenia przekażcie sobie przez dowolny komunikator.</p><div class="rolegrid"><button class="role primary" onclick="hostStart()" ${configured?'':'disabled'}><b>Gram Dexterem</b><span>Iskra-7 · gospodarz rozgrywki</span></button><button class="role" onclick="guestScreen()" ${configured?'':'disabled'}><b>Gram Parkerem</b><span>Peregryn · dołączenie do Dextera</span></button></div><div class="linkconfig"><label>Serwer pośredniczący TURN</label><div class="row"><textarea id="turnApi" autocomplete="off" placeholder="Wklej pełny adres API albo cały blok iceServers"></textarea><button class="primary" onclick="saveTurn()">Zapisz konfigurację</button>${configured?'<button onclick="clearTurn()">Usuń konfigurację</button>':''}</div><p class="${configured?'ready':''}">${configured?'TURN skonfigurowany lokalnie. Dane nie są zapisane w pliku gry.':'Wklej pełny adres API lub blok iceServers na obu komputerach. Ustawienie zostanie zapisane tylko w tej przeglądarce.'}</p></div><div class="note">TURN przejmuje połączenie, gdy router, zapora lub sieć operatora blokuje bezpośrednie P2P.</div></section></main>`)}
async function iceServers(){const saved=turnConfig();if(!saved)throw Error('Najpierw skonfiguruj serwer TURN.');if(!/^https:\/\//i.test(saved)){const list=JSON.parse(saved);if(!Array.isArray(list)||!list.some(x=>String(x.urls||'').startsWith('turn')))throw Error('Zapisana konfiguracja TURN jest nieprawidłowa.');return list}const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(saved,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('Serwer TURN zwrócił błąd '+response.status+'.');const list=await response.json();if(!Array.isArray(list)||!list.some(x=>String(x.urls||'').startsWith('turn')))throw Error('Odpowiedź nie zawiera serwera TURN.');return[{urls:'stun:stun.l.google.com:19302'},...list]}catch(e){if(e.name==='AbortError')throw Error('Serwer TURN nie odpowiedział w ciągu 10 sekund.');throw e}finally{clearTimeout(timer)}}
async function pcCreate(){if(!window.RTCPeerConnection)throw Error('Ta przeglądarka nie obsługuje WebRTC. Użyj aktualnego Chrome, Edge albo Firefox.');MP.status='Pobieranie bezpiecznej konfiguracji TURN…';addDiag('start',{stage:'pcCreate'});render();const servers=await iceServers();addDiag('turn-config-loaded',{servers:servers.length,turnServers:servers.filter(x=>String(x.urls||'').startsWith('turn')).length});const pc=new RTCPeerConnection({iceServers:servers,iceTransportPolicy:'relay',iceCandidatePoolSize:10});pc.onicecandidate=e=>{if(e.candidate)addDiag('ice-candidate',{type:e.candidate.type||'nieznany',protocol:e.candidate.protocol||'nieznany'});else addDiag('ice-candidates-complete',candidateStats())};pc.onicecandidateerror=e=>{addDiag('ice-candidate-error',{code:e.errorCode||'brak',text:e.errorText||'brak',url:e.url||'brak'});MP.status='Jeden wariant TURN nie odpowiedział · sprawdzanie pozostałych portów…';updateConnectionView()};pc.onicegatheringstatechange=()=>addDiag('ice-gathering-state',{state:pc.iceGatheringState});pc.onsignalingstatechange=()=>addDiag('signaling-state',{state:pc.signalingState});pc.oniceconnectionstatechange=()=>{const st=pc.iceConnectionState;addDiag('ice-connection-state',{state:st});if(st==='checking'){MP.status='Sprawdzanie wymuszonej trasy TURN…';updateConnectionView()}if(st==='failed'){MP.status='Trasa TURN nie została zestawiona. Otwórz raport techniczny poniżej.';updateConnectionView()}};pc.onconnectionstatechange=()=>{const st=pc.connectionState;addDiag('connection-state',{state:st});if(st==='connected'){if(MP.recoverTimer)clearTimeout(MP.recoverTimer);if(MP.connectTimer)clearTimeout(MP.connectTimer);MP.recoverTimer=null;MP.connectTimer=null;MP.status=`Połączono przez TURN · wersja ${APP_VERSION}`;render();return}if(st==='disconnected'){MP.status='Łącze przerwane · próba automatycznego wznowienia…';try{pc.restartIce()}catch{}if(MP.recoverTimer)clearTimeout(MP.recoverTimer);MP.recoverTimer=setTimeout(()=>{if(['disconnected','failed'].includes(pc.connectionState)){MP.status='Nie udało się odzyskać połączenia. Otwórz raport techniczny poniżej.';updateConnectionView()}},12000);updateConnectionView();return}if(st==='failed'){if(MP.connectTimer)clearTimeout(MP.connectTimer);MP.status='Połączenie TURN nieudane. Otwórz raport techniczny poniżej.';updateConnectionView();return}if(st==='closed'){MP.status='Połączenie zamknięte';updateConnectionView()}};MP.pc=pc;return pc}
function encodeSDP(desc){const bytes=new TextEncoder().encode(JSON.stringify(desc));let raw='';for(const b of bytes)raw+=String.fromCharCode(b);return btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeSDP(code){let x=String(code||'').trim().replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';const raw=atob(x),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function iceDone(pc){return new Promise((resolve,reject)=>{let ended=false;const end=reason=>{if(ended)return;ended=true;const sdp=pc.localDescription?.sdp||'',stats=candidateStats();addDiag('ice-gathering-finished',{reason,candidates:JSON.stringify(stats)});if(!/a=candidate:/m.test(sdp)){reject(Error('Nie udało się pobrać żadnej trasy połączenia.'));return}if(!/ typ relay /m.test(sdp)){reject(Error('Serwer TURN nie udostępnił kandydata relay.'));return}resolve()};if(pc.iceGatheringState==='complete')return end('complete-before-listener');pc.addEventListener('icegatheringstatechange',()=>pc.iceGatheringState==='complete'&&end('complete'));setTimeout(()=>end('timeout-15s'),15000)})}
function startHeartbeat(){if(MP.heartbeat)clearInterval(MP.heartbeat);MP.lastPong=Date.now();MP.heartbeat=setInterval(()=>{if(MP.dc?.readyState!=='open')return;send({type:'ping',at:Date.now()});if(Date.now()-MP.lastPong>16000){MP.status='Drugi gracz nie odpowiada · sprawdzanie łącza…';render()}},5000)}
function channel(dc){MP.dc=dc;dc.onopen=()=>{if(MP.connectTimer)clearTimeout(MP.connectTimer);MP.connectTimer=null;MP.status='Połączono · sprawdzanie wersji…';startHeartbeat();send({type:'hello',version:APP_VERSION,role:MP.role});render()};dc.onclose=()=>{if(MP.heartbeat)clearInterval(MP.heartbeat);MP.status='Połączenie zamknięte';render()};dc.onerror=()=>showError('Utracono połączenie.');dc.onmessage=e=>{try{message(JSON.parse(e.data))}catch{}}}
function copyCode(id){const el=document.getElementById(id);if(!el)return;el.select();navigator.clipboard?.writeText(el.value).catch(()=>{});}
function showError(text){MP.status='Błąd: '+text;addDiag('error',{message:text});updateConnectionView()}
async function hostStart(){try{MP.role='dex';MP.host=true;MP.status='Tworzenie zaproszenia…';addDiag('host-start');const pc=await pcCreate(),dc=pc.createDataChannel('monit-multiplayer');channel(dc);await pc.setLocalDescription(await pc.createOffer());await iceDone(pc);MP.signal=encodeSDP(pc.localDescription);MP.status='Zaproszenie gotowe · trasa TURN aktywna';addDiag('offer-ready',{length:MP.signal.length});hostScreen()}catch(e){showError(e.message);hostScreen()}}
function hostScreen(){setApp(`<main class="shell"><div class="top"><div><small>STANOWISKO DEXTERA · GOSPODARZ</small><h1>Połącz z Parkerem</h1></div><span class="grow"></span><button onclick="lobby()">Anuluj</button></div><section class="panel steps"><div class="twocol"><div><small>KROK 1</small><h3>Wyślij Parkerowi kod zaproszenia</h3><textarea id="offer" readonly>${esc(MP.signal)}</textarea><button onclick="copyCode('offer')">Kopiuj kod</button></div><div><small>KROK 2</small><h3>Wklej odpowiedź Parkera</h3><textarea id="answer" placeholder="Kod odpowiedzi…"></textarea><button class="primary" onclick="hostAccept()">Połącz</button></div></div><p id="status" class="status">${esc(MP.status||'Oczekiwanie na Parkera')}</p><div id="diagnostics">${diagnosticHtml()}</div></section></main>`)}
async function hostAccept(){try{const answer=$('#answer').value;addDiag('answer-received',{length:answer.length});await MP.pc.setRemoteDescription(decodeSDP(answer));MP.status='Łączenie przez wymuszoną trasę TURN…';if(MP.connectTimer)clearTimeout(MP.connectTimer);MP.connectTimer=setTimeout(()=>{if(MP.dc?.readyState!=='open'){addDiag('connection-timeout',{seconds:25});MP.status='Przekroczono czas połączenia. Otwórz raport techniczny poniżej.';updateConnectionView()}},25000);hostScreen()}catch(e){showError('Nieprawidłowy kod odpowiedzi: '+e.message);hostScreen()}}
function guestScreen(){MP.role='parker';MP.host=false;setApp(`<main class="shell"><div class="top"><div><small>STANOWISKO PARKERA</small><h1>Dołącz do Dextera</h1></div><span class="grow"></span><button onclick="lobby()">Anuluj</button></div><section class="panel hero"><h3>Wklej kod zaproszenia Dextera</h3><textarea id="invite" style="width:100%;min-height:140px" placeholder="Kod zaproszenia…"></textarea><button class="primary" style="margin-top:10px" onclick="guestJoin()">Utwórz odpowiedź</button><p id="status" class="status">${esc(MP.status||'Oczekiwanie na kod zaproszenia.')}</p><div id="diagnostics">${diagnosticHtml()}</div></section></main>`)}
async function guestJoin(){try{const invite=$('#invite').value;addDiag('offer-received',{length:invite.length});const offer=decodeSDP(invite),pc=await pcCreate();pc.ondatachannel=e=>channel(e.channel);await pc.setRemoteDescription(offer);await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc);MP.signal=encodeSDP(pc.localDescription);MP.status='Wyślij odpowiedź Dexterowi';addDiag('answer-ready',{length:MP.signal.length});setApp(`<main class="shell"><div class="top"><div><small>STANOWISKO PARKERA</small><h1>Odpowiedź gotowa</h1></div><span class="grow"></span><button onclick="lobby()">Anuluj</button></div><section class="panel hero"><h3>Wyślij ten kod Dexterowi</h3><textarea id="response" style="width:100%;min-height:140px" readonly>${esc(MP.signal)}</textarea><button onclick="copyCode('response')">Kopiuj odpowiedź</button><p id="status" class="status">Poczekaj, aż Dexter wklei odpowiedź i zatwierdzi połączenie. Trasa TURN została dołączona do odpowiedzi.</p><div id="diagnostics">${diagnosticHtml()}</div></section></main>`)}catch(e){showError(e.message||'Nieprawidłowy kod zaproszenia.');guestScreen()}}
function send(data){if(MP.dc?.readyState==='open')MP.dc.send(JSON.stringify(data))}
function publicState(){const s=clone(MP.state);s.version=APP_VERSION;s.submitted={dex:!!s.orders.dex,parker:!!s.orders.parker};delete s.orders;return s}
function sendState(){if(MP.host&&MP.state)send({type:'state',state:publicState()});render()}
function message(m){if(m.type==='ping'){send({type:'pong',at:m.at});return}if(m.type==='pong'){MP.lastPong=Date.now();return}if(m.type==='versionError'){showError(`Niezgodna wersja. Ty: ${APP_VERSION}, drugi gracz: ${m.expected||'inna'}.`);return}if(m.type==='hello'){MP.peerVersion=m.version;if(m.version!==APP_VERSION){send({type:'versionError',expected:APP_VERSION});showError(`Niezgodna wersja gry: ${m.version||'nieznana'}. Obaj gracze muszą otworzyć wersję ${APP_VERSION}.`);return}MP.status=`Połączono · zgodna wersja ${APP_VERSION}`;if(MP.host&&!MP.state){MP.state=newState();sendState()}else render();return}if(MP.host&&m.type==='order'&&m.role==='parker'&&ORDERS[m.order]){if(MP.state?.phase!=='orders'||MP.state.orders.parker||!active(MP.state.ships.parker))return;MP.state.orders.parker={order:m.order,torpedo:!!m.torpedo,energy:m.energy!==false};sendState();maybeResolve();return}if(!MP.host&&m.type==='state'){if(m.state?.version&&m.state.version!==APP_VERSION){showError(`Stan pochodzi z wersji ${m.state.version}. Wymagana wersja ${APP_VERSION}.`);return}MP.state=m.state;if(MP.state.phase!=='orders'||!MP.state.submitted?.parker){MP.localOrder=null;MP.draft=null}render()}}
function newState(){const ships=clone(FITS),s={version:APP_VERSION,round:1,phase:'contact',contactStep:0,ships,orders:{dex:null,parker:null},target:null,log:['Wykryto okręt Kalaxian. Wyposażenie: nieznane.'],rolls:[],result:null,lastHits:[],lastAttackers:[],stats:{dex:{dealt:0,taken:0,torpedoes:0},parker:{dealt:0,taken:0,torpedoes:0}}};chooseTarget(s,true);return s}
function contactAdvance(){if(!MP.host||MP.state?.phase!=='contact')return;if(MP.state.contactStep===0){MP.state.contactStep=1;sendState();return}MP.state.phase='orders';MP.state.log.unshift('Pierwszy kontakt zakończył się bez odpowiedzi. Okręt Kalaxian otworzył ogień.');sendState()}
function contactLines(step){if(step===0)return `<div class="line"><b>PARKER:</b>Mam ich na kanale. Obraz próbuje się zsynchronizować.</div><div class="line"><b>DEXTER:</b>Nieznana jednostko, tu Iskra-7. Zidentyfikujcie się i podajcie zamiary.</div><div class="line system">KANAŁ OTWARTY · ODBIORCA POŁĄCZONY</div><div class="line system">[ CISZA ]</div>`;return `<div class="line"><b>DEXTER:</b>Powtarzam: zidentyfikujcie się.</div><div class="line"><b>PARKER:</b>Dexter… nic. Tylko ten cień. Nie wiem nawet, czy patrzymy na istotę.</div><div class="line system">BRAK ODPOWIEDZI</div><div class="line"><b>PARKER:</b>Wzrost energii! Ładują uzbrojenie!</div><div class="line"><b>DEXTER:</b>Kontakt zerwany. Do stanowisk. Odpowiadamy ogniem.</div><div class="line system">ALARM · OKRĘT KALAXIAN OTWIERA OGIEŃ</div>`}
function renderContact(){setMode('contactmode');const step=MP.state.contactStep||0;setApp(`<main class="shell"><div class="top"><div><small>PIERWSZY KONTAKT · TRANSMISJA NIEZNANA</small><h1>Próba połączenia</h1></div><span class="grow"></span><span class="badge">${esc(MP.status||'Połączono')}</span></div><section class="panel contact"><div class="signal"><div class="shadow139"></div><div class="static139"></div></div><div class="dialogue">${contactLines(step)}</div>${MP.host?`<button class="primary" onclick="contactAdvance()">${step===0?'Ponów wezwanie':'Do stanowisk bojowych'}</button>`:'<div class="wait">Dexter prowadzi próbę kontaktu. Obserwujesz transmisję…</div>'}</section></main>`)}
function active(p){return !!p&&p.hull>0&&!p.escaped}
function randomIndex(n){if(n<=1)return 0;const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function chooseTarget(s,first){if(active(s.ships[s.target]))return s.target;const alive=['dex','parker'].filter(k=>active(s.ships[k]));s.target=alive.length?alive[randomIndex(alive.length)]:null;if(s.target)s.log.unshift((first?'Kalaxian namierza ':'Kalaxian przenosi ogień na ')+s.ships[s.target].name+'.');return s.target}
function face(color){const pool=color==='green'?['hit','hit','hit','eye','eye','blank','blank','blank']:['hit','hit','hit','crit','eye','eye','blank','blank'];return pool[randomIndex(8)]}
function dice(n,color,reroll){let f=Array.from({length:Math.max(0,n)},()=>face(color));if(reroll)f=f.map(x=>(x==='eye'||x==='blank')?face(color):x);return f}
function faceScore(f){return f.reduce((n,x)=>n+(x==='hit'?1:x==='crit'?2:0),0)}
function count(f,x){return f.filter(v=>v===x).length}
function attack(ship,useEnergy,torpedo){const used=!!torpedo&&ship.torpedoes>0,faces=dice(ship.attack+(used?2:0),'red',true),eyes=count(faces,'eye'),spend=useEnergy?Math.min(ship.energy,eyes):0;ship.energy-=spend;if(used)ship.torpedoes--;return{faces,score:faceScore(faces)+spend,energy:spend,torpedo:used}}
function defend(ship,incoming,reroll,useEnergy){const faces=dice(ship.agility,'green',reroll),base=faceScore(faces),eyes=count(faces,'eye'),need=Math.max(0,incoming-base),spend=useEnergy?Math.min(ship.energy,eyes,need):0;ship.energy-=spend;return{faces,score:base+spend,energy:spend}}
function damage(ship,n){const shield=Math.min(ship.shield,n),hull=Math.min(ship.hull,n-shield);ship.shield-=shield;ship.hull-=hull;return{shield,hull}}
function rollLog(s,who,kind,r){s.rolls.push({who,kind,faces:r.faces,score:r.score,energy:r.energy||0,torpedo:!!r.torpedo})}
function hit(s,attacker,target,a,d){const left=Math.max(0,a.score-d.score),loss=damage(target,left),total=loss.shield+loss.hull;if(total>0){s.lastHits=s.lastHits||[];s.lastAttackers=s.lastAttackers||[];s.lastHits.push(target.key);s.lastAttackers.push(attacker.key);if(s.stats?.[attacker.key])s.stats[attacker.key].dealt+=total;if(s.stats?.[target.key])s.stats[target.key].taken+=total}s.log.unshift(`${attacker.name}: ${a.score} obrażeń · ${target.name}: ${d.score} uników · osłona −${loss.shield}, kadłub −${loss.hull}.`);if(target.hull<=0)s.log.unshift(target.name+' został zniszczony.')}
function enemyTurn(s){const e=s.ships.enemy,key=chooseTarget(s,false);if(!key)return;const t=s.ships[key],o=s.orders[key],a=attack(e,true,false),d=defend(t,a.score,o.order==='obrona'||o.order==='ucieczka',o.energy);rollLog(s,'Kalaxian','Atak',a);rollLog(s,t.name,'Obrona',d);hit(s,e,t,a,d)}
function playerTurn(s,key){const p=s.ships[key],e=s.ships.enemy,o=s.orders[key];if(!active(p)||!active(e))return;if(o.order==='obrona'){s.log.unshift(p.name+' utrzymuje pozycję obronną.');return}if(o.order==='ucieczka'){const r=defend(p,1,true,o.energy);rollLog(s,p.name,'Ucieczka',r);if(r.score>0){p.escaped=true;s.log.unshift(p.name+' opuszcza sektor.')}else s.log.unshift(p.name+' nie zdołał wyrwać się z pola walki.');return}const a=attack(p,o.energy,o.torpedo),d=defend(e,a.score,false,true);if(a.torpedo&&s.stats?.[key])s.stats[key].torpedoes++;rollLog(s,p.name,'Atak',a);rollLog(s,'Kalaxian','Obrona',d);hit(s,p,e,a,d)}
function endCheck(s){if(s.ships.enemy.hull<=0){s.phase='end';s.result='victory';s.log.unshift('Okręt Kalaxian został zniszczony. Dexter i Parker wygrywają.');return true}const alive=['dex','parker'].filter(k=>active(s.ships[k]));if(!alive.length){s.phase='end';s.result=(s.ships.dex.escaped||s.ships.parker.escaped)?'escaped':'defeat';s.log.unshift(s.result==='defeat'?'Oba statki zostały zniszczone.':'Załoga wycofała się z sektora.');return true}return false}
function readyToResolve(s){return ['dex','parker'].every(k=>!active(s.ships[k])||!!s.orders[k])}
function orderLabel(s,key){const p=s.ships[key];if(p.escaped)return'Obserwator po ucieczce';if(p.hull<=0)return'Jednostka zniszczona';return ORDERS[s.orders[key]?.order]||'Brak rozkazu'}
function resolveRound(){const s=MP.state;if(!MP.host||!s||s.phase!=='orders'||!readyToResolve(s))return;s.phase='resolving';s.rolls=[];s.lastHits=[];s.lastAttackers=[];s.log.unshift(`Runda ${s.round}: Dexter — ${orderLabel(s,'dex')}, Parker — ${orderLabel(s,'parker')}.`);for(const key of ['enemy','dex','parker'].sort((a,b)=>s.ships[b].initiative-s.ships[a].initiative)){if(endCheck(s))break;key==='enemy'?enemyTurn(s):playerTurn(s,key)}if(!endCheck(s)){chooseTarget(s,false);s.round++;s.orders={dex:null,parker:null};s.phase='orders'}MP.localOrder=null;MP.draft=null;sendState()}
function maybeResolve(){if(MP.host&&MP.state?.phase==='orders'&&readyToResolve(MP.state))setTimeout(resolveRound,350)}
function selectOrder(v){if(!ORDERS[v])return;MP.draft=v;renderControls()}
function submitOrder(){const key=MP.role==='dex'?'dex':'parker';if(!active(MP.state?.ships[key])||!ORDERS[MP.draft])return;const o={order:MP.draft,torpedo:!!$('#torpedo')?.checked,energy:$('#energy')?.checked!==false};MP.localOrder=o;if(MP.host){if(MP.state.orders.dex)return;MP.state.orders.dex=o;sendState();maybeResolve()}else{send({type:'order',role:'parker',...o});render()}}
function bar(v,m){return `<div class="bar"><i style="width:${m?Math.max(0,100*v/m):0}%"></i></div>`}
function shipArt(key){if(key==='enemy')return `<div class="art enemy"><svg viewBox="0 0 260 140"><path d="M15 82L62 34l68-22 68 22 47 48-48 34-67 12-67-12z" fill="#211418" stroke="currentColor" stroke-width="4"/><path d="M62 34l68 48 68-48M15 82h230M63 116l67-34 67 34" fill="none" stroke="#ef7a3c66" stroke-width="2"/><circle cx="130" cy="82" r="18" fill="#ef7a3c" opacity=".55"/><circle cx="130" cy="82" r="7" fill="#fff0d0"/></svg><span class="sparks"></span></div>`;const parker=key==='parker';return `<div class="art"><svg viewBox="0 0 260 140"><path d="${parker?'M20 78L85 35l125 13 30 30-30 30-125 0z':'M22 75L92 25l130 50-130 42z'}" fill="#263b46" stroke="currentColor" stroke-width="4"/><path d="${parker?'M85 35l22 43-22 30M107 78h133':'M22 75h200M92 25l26 50-26 42'}" fill="none" stroke="#eed28a88" stroke-width="2"/><circle cx="${parker?205:171}" cy="75" r="9" fill="#eed28a"/></svg><span class="sparks"></span></div>`}
function shipCard(key){const s=MP.state,p=s.ships[key],enemy=key==='enemy',target=s.target===key,out=!active(p),ratio=p.maxHull?p.hull/p.maxHull:0,damageClass=ratio<=.3?'critical':ratio<=.65?'damaged':'',hitClass=(s.lastHits||[]).includes(key)?'hitflash':'',fireClass=(s.lastAttackers||[]).includes(key)?'firing':'';return `<section class="panel ship ${enemy?'enemycard':''} ${target?'target':''} ${out?'out':''} ${damageClass} ${hitClass} ${fireClass}"><small>${enemy?'CEL · KALAXIAN':key==='dex'?'GRACZ 1 · DEXTER':'GRACZ 2 · PARKER'}${target?' · NAMIERZONY':''}</small><h3>${esc(p.name)}</h3>${shipArt(key)}<div class="stats">${[['Atak',p.attack],['Zwrotność',p.agility],['Inicjatywa',p.initiative]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div class="stat"><span>Osłona</span><b>${p.shield}/${p.maxShield}</b>${bar(p.shield,p.maxShield)}</div><div class="stat"><span>Kadłub</span><b>${p.hull}/${p.maxHull}</b>${bar(p.hull,p.maxHull)}</div><div class="stat"><span>Energia</span><b>${p.energy}/${p.maxEnergy}</b>${bar(p.energy,p.maxEnergy)}</div></div><p>${esc(p.loadout)}${enemy?'':' · Torpedy: '+p.torpedoes}${p.escaped?' · Opuścił sektor':''}${p.hull<=0?' · Zniszczony':''}</p></section>`}
const SYMBOL={hit:'●',crit:'✦',eye:'◉',blank:'—'};
function rolls(){const rows=MP.state?.rolls||[];if(!rows.length)return'';return `<section class="panel rolls"><small>OSTATNIE RZUTY</small>${rows.map(r=>`<div class="rollrow"><b>${esc(r.who)} · ${esc(r.kind)}: ${r.score}</b>${r.energy?` <span class="badge">energia −${r.energy}</span>`:''}${r.torpedo?' <span class="badge">torpeda</span>':''}<div class="dice">${r.faces.map(f=>`<i class="die ${r.kind==='Obrona'||r.kind==='Ucieczka'?'green':''}"><span>${SYMBOL[f]}</span></i>`).join('')}</div></div>`).join('')}</section>`}
function endingDialogue(s){const d=s.ships.dex,p=s.ships.parker;if(s.result==='victory'){if(d.escaped)return `<div class="line"><b>PARKER:</b>Dexter, odbierasz? Kalaxian zniszczony.</div><div class="line"><b>DEXTER:</b>Odbieram. Widziałem wszystko z bezpiecznej odległości.</div><div class="line"><b>PARKER:</b>Nie odpowiedzieli ani razu.</div><div class="line"><b>DEXTER:</b>I nadal nie wiemy, co było po drugiej stronie.</div>`;if(p.escaped)return `<div class="line"><b>DEXTER:</b>Parker, odbierasz? Cel zniszczony.</div><div class="line"><b>PARKER:</b>Odbieram. Obserwowałem walkę do końca.</div><div class="line"><b>DEXTER:</b>Nie odpowiedzieli ani razu.</div><div class="line"><b>PARKER:</b>I nadal nie wiemy, co było po drugiej stronie.</div>`;return `<div class="line"><b>PARKER:</b>Kanał Kalaxian zamilkł.</div><div class="line"><b>DEXTER:</b>On nigdy się nie odezwał.</div><div class="line"><b>PARKER:</b>Wciąż nie wiemy, z kim walczyliśmy.</div><div class="line"><b>DEXTER:</b>Nie. Wiemy tylko, że pierwszy kontakt zakończyli ogniem.</div>`}if(s.result==='escaped'){if(d.escaped&&p.hull<=0)return `<div class="line"><b>DEXTER:</b>Parker? Odpowiedz.</div><div class="line system">BRAK SYGNAŁU PEREGRYNA</div><div class="line"><b>DEXTER:</b>Kalaxianie milczeli. Teraz milczy także Parker.</div>`;if(p.escaped&&d.hull<=0)return `<div class="line"><b>PARKER:</b>Dexter? Iskra-7, odpowiedz.</div><div class="line system">BRAK SYGNAŁU ISKRY-7</div><div class="line"><b>PARKER:</b>Nie dowiedzieliśmy się nawet, co było po drugiej stronie.</div>`;return `<div class="line"><b>PARKER:</b>Oderwaliśmy się. Nadal są za nami?</div><div class="line"><b>DEXTER:</b>Nie. I nadal nie odpowiedzieli ani razu.</div><div class="line"><b>PARKER:</b>Nie wiemy, co właśnie spotkaliśmy.</div><div class="line"><b>DEXTER:</b>Ale wiemy, że nie chcieli rozmawiać.</div>`}return `<div class="line system">TRANSMISJA DEXTER–PARKER UTRACONA</div><div class="line system">KALAXIANIE NIE PRZESŁALI ŻADNEJ WIADOMOŚCI</div>`}
const endingDialogueBase=endingDialogue;
endingDialogue=function(s){const d=s.ships.dex,p=s.ships.parker;if(s.result==='victory'&&d.hull<=0&&p.hull>0)return `<div class="line"><b>PARKER:</b>Dexter? Iskra-7, odpowiedz. Cel zniszczony.</div><div class="line system">BRAK SYGNAŁU ISKRY-7</div><div class="line"><b>PARKER:</b>Wygraliśmy… ale nie dowiemy się, czym zapłacił Dexter.</div>`;if(s.result==='victory'&&p.hull<=0&&d.hull>0)return `<div class="line"><b>DEXTER:</b>Parker? Peregryn, odpowiedz. Kalaxian zniszczony.</div><div class="line system">BRAK SYGNAŁU PEREGRYNA</div><div class="line"><b>DEXTER:</b>Pierwszy kontakt. Pierwsze zwycięstwo. I pierwsza strata.</div>`;return endingDialogueBase(s)};
function endingTitle(s){const d=s.ships.dex,p=s.ships.parker;if(s.result==='victory'){if(d.hull<=0||p.hull<=0)return'ZWYCIĘSTWO OKUPIONE STRATĄ';if(d.escaped||p.escaped)return'SAMOTNE ZWYCIĘSTWO';return'PIERWSZY KONTAKT: ZWYCIĘSTWO'}if(s.result==='escaped'){if(d.hull<=0||p.hull<=0)return'OCALAŁ TYLKO JEDEN';return'WSPÓLNY ODWRÓT'}return'CISZA PO BITWIE'}
function finalShipStatus(p){return p.hull<=0?'Zniszczony':p.escaped?'Wycofany':`Kadłub ${p.hull}/${p.maxHull}`}
function resultSummary(s){const ds=s.stats?.dex||{dealt:0,taken:0,torpedoes:0},ps=s.stats?.parker||{dealt:0,taken:0,torpedoes:0};return `<div class="summarygrid"><div class="summarybox"><span>Rundy</span><b>${s.round}</b></div><div class="summarybox"><span>Dexter</span><b>${finalShipStatus(s.ships.dex)}</b></div><div class="summarybox"><span>Parker</span><b>${finalShipStatus(s.ships.parker)}</b></div><div class="summarybox"><span>Obrażenia Dextera</span><b>${ds.dealt}</b></div><div class="summarybox"><span>Obrażenia Parkera</span><b>${ps.dealt}</b></div><div class="summarybox"><span>Torpedy użyte</span><b>${ds.torpedoes+ps.torpedoes}</b></div></div>`}
function renderControls(){const box=document.getElementById('controls');if(!box||!MP.state)return;const key=MP.role==='dex'?'dex':'parker',p=MP.state.ships[key],submitted=MP.host?!!MP.state.orders?.dex:!!MP.localOrder;if(MP.state.phase==='end'){box.innerHTML=`<div class="result"><small>WALKA ZAKOŃCZONA</small><h2>${endingTitle(MP.state)}</h2>${resultSummary(MP.state)}<div class="epilogue">${endingDialogue(MP.state)}</div><button class="primary" onclick="lobby()">Nowe połączenie</button></div>`;return}if(!active(p)){const reason=p.escaped?'Wycofałeś się z pola walki.':'Twój statek został wyłączony z walki.';box.innerHTML=`<div class="observer"><small>TRYB OBSERWATORA</small><h3>${reason}</h3><p>Walka trwa. Obserwujesz działania drugiego gracza i kolejne rzuty, ale nie wydajesz już rozkazów.</p></div>`;return}if(submitted){box.innerHTML=`<div class="wait">Rozkaz ${esc(ORDERS[MP.localOrder?.order]||'')} zatwierdzony. Oczekiwanie na drugiego gracza…</div>`;return}box.innerHTML=`<small>TWÓJ ROZKAZ · ${MP.role==='dex'?'DEXTER':'PARKER'}</small><div class="orders">${Object.entries(ORDERS).map(([k,v])=>`<button class="${MP.draft===k?'on':''}" onclick="selectOrder('${k}')">${v}</button>`).join('')}</div><div class="checks"><label><input id="energy" type="checkbox" checked> Używaj energii na oczy, gdy jest potrzebna</label>${p.torpedoes>0?'<label><input id="torpedo" type="checkbox"> Użyj torpedy (+2 czerwone kości)</label>':''}</div><button class="primary" onclick="submitOrder()" ${MP.draft?'':'disabled'}>Zatwierdź rozkaz</button>`}
function render(){if(!MP.state){updateConnectionView();return}if(MP.state.phase==='contact'){renderContact();return}const s=MP.state;setMode(s.phase==='end'?'epiloguemode':'battlemode');const other=MP.role==='dex'?'Parker':'Dexter',otherKey=MP.role==='dex'?'parker':'dex',otherShip=s.ships[otherKey],submitted=s.submitted||{dex:!!s.orders?.dex,parker:!!s.orders?.parker},otherStatus=otherShip.escaped?'wycofał się i obserwuje':otherShip.hull<=0?'jednostka zniszczona':submitted[otherKey]?'rozkaz zatwierdzony':'wybiera rozkaz',versionClass=MP.peerVersion&&MP.peerVersion!==APP_VERSION?'versionbad':'versionok';setApp(`<main class="shell"><div class="top"><div><small>WALKA MULTIPLAYER · ${MP.role==='dex'?'DEXTER':'PARKER'}</small><h1>${s.phase==='end'?'Raport końcowy':'Runda '+s.round}</h1></div><span class="grow"></span><span class="badge ${versionClass}">${esc(MP.status||'Połączono')}</span><button class="danger" onclick="lobby()">Rozłącz</button></div><div class="ships">${shipCard('dex')}${shipCard('parker')}${shipCard('enemy')}</div>${rolls()}<section class="panel controls" id="controls"></section><section class="panel journal"><small>STATUS DRUGIEGO GRACZA</small><p>${other}: ${otherStatus} · wersja ${esc(MP.peerVersion||'sprawdzanie…')}</p></section><section class="panel journal"><small>REJESTR WALKI</small><div class="log">${s.log.map(x=>`<div>${esc(x)}</div>`).join('')}</div></section></main>`);renderControls()}
lobby();
</script>
</body>
</html>
